name: GCP - PostgreSQL
variables:
  - name: Host
    value: http://cloud-api-dotnet-postgres-1efb2c36c23f.us-central1.run.localhost.floci.io:4588/
    description: "The base URL for cloud-api-dotnet-postgres in the GCP emulator. It changes when the API is redeployed: Testing\\RunBrunoCloudTests-gcp.bat overrides it on every run with the current URL from the Terraform state (Docker repository, Clouds\\terraform\\gcp\\20-apis)."
  - name: ApiTitle
    value: cloud-api-dotnet
    description: "Text the API name and OpenAPI title must contain. The cloud deployments set OpenApi:Title to <cloud>-cloud-api-dotnet-<db> (Clouds\\terraform\\modules\\api-env), so the default (PilotApi) does not apply."

info:
  name: Add_InvalidModel
  type: http
  seq: 7

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "address": "507 - 20th Ave. E.Apt. 2A",
        "birthDate": "1948-12-08T00:00:00",
        "city": "Test City",
        "country": "USA",
        "extension": "5467",
        "firstName": "Test First Name",
        "hireDate": "1992-05-01T00:00:00",
        "homePhone": "(206) 555-9857",
        "lastName": "Test Last",
        "notes": "This is a test Item",
        "photo": null,
        "photoPath": "http://accweb/emmployees/test.bmp",
        "postalCode": "98122",
        "region": "WA",
        "reportsTo": 2,
        "title": "Test Position",
        "titleOfCourtesy": "Mr."
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should report firstName longer than 10 characters", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("errors");
          const errorKeys = Object.keys(resBody.errors).map(key => key.toLowerCase());
          expect(errorKeys.some(key => key.endsWith("firstname"))).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

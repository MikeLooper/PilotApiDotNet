info:
  name: Add_InvalidModel
  type: http
  seq: 7

http:
  method: POST
  url: "{{Host}}v{{version}}/{{controller}}/add"
  body:
    type: json
    data: |-
      {
        "categoryName": "Test Category 16",
        "description": "Test Category",
        "picture": null
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return bad request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("should report categoryName longer than 15 characters", function () {
          const resBody = res.getBody();

          expect(resBody).to.have.property("errors");
          const errorKeys = Object.keys(resBody.errors).map(key => key.toLowerCase());
          expect(errorKeys.some(key => key.endsWith("categoryname"))).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
